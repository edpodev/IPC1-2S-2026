<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" role="img" aria-label="Comparacion entre una funcion y un procedimiento en Java. La funcion int sumar(int a, int b) recibe parametros y devuelve un valor con return, representado por una flecha verde de salida hacia una caja de resultado. El procedimiento void saludar(String nombre) recibe un parametro pero no devuelve nada: en el lugar donde iria el resultado hay una caja vacia marcada sin retorno, y en su lugar produce un efecto secundario, como imprimir en la consola.">
  <title>Función vs. procedimiento: ¿el método devuelve algo o no?</title>

  <rect x="0" y="0" width="820" height="400" fill="#ffffff"/>

  <defs>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <text x="410" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">¿El método te devuelve algo que puedas usar?</text>

  <!-- ===================== Lane 1: función ===================== -->
  <text x="60" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#059669">función</text>

  <line x1="40" y1="110" x2="130" y2="110" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
  <text x="85" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">parámetros</text>

  <rect x="130" y="80" width="240" height="60" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="250" y="115" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a">int sumar(int a, int b)</text>

  <line x1="370" y1="110" x2="450" y2="110" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="410" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#059669">return a + b</text>

  <rect x="450" y="80" width="170" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="535" y="105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#065f46">resultado: int</text>
  <text x="535" y="124" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#065f46">listo para usarse</text>

  <!-- ===================== Lane 2: procedimiento ===================== -->
  <text x="60" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">procedimiento</text>

  <line x1="40" y1="250" x2="130" y2="250" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
  <text x="85" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">parámetro</text>

  <rect x="130" y="220" width="240" height="60" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="250" y="255" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#0f172a">void saludar(String nombre)</text>

  <!-- same slot as the green result box, but empty/crossed out -->
  <rect x="450" y="220" width="170" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="535" y="255" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">— sin retorno —</text>

  <!-- side effect, drawn differently from the return arrow: dashed, going down -->
  <path d="M250,280 C 250,320 250,320 250,320" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowSlate)"/>
  <rect x="150" y="320" width="200" height="44" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="250" y="347" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">efecto: imprime en consola</text>

  <line x1="410" y1="55" x2="410" y2="380" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="700" y="345" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">int x = saludar(...);</text>
  <text x="700" y="362" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#dc2626">✕ no compila</text>
</svg>
